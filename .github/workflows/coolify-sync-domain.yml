name: Coolify Sync Domain

# Apply production host https://voca.kenchange.com on Coolify (FQDN + CORS/API env).
# Runs on the self-hosted runner so it can reach Coolify at localhost:8000.

on:
  workflow_dispatch:
  # One-shot: TOM-100 — remove this push trigger after /api 502 is fixed
  push:
    branches:
      - cursor/tom-100-fix-api-502-fe41

jobs:
  sync:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose Coolify access on runner
        run: |
          set -euo pipefail
          echo "HOME=$HOME USER=$(whoami)"
          echo "Coolify-related files (names only):"
          ls -la "$HOME/.coolify" 2>/dev/null || echo "  no ~/.coolify"
          ls -la "$HOME/.coolify-tokens-rotated-2026-08-08" 2>/dev/null || echo "  no rotated tokens dir"
          echo "Docker access:"
          if command -v docker >/dev/null 2>&1; then
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>&1 | head -40 || true
          else
            echo "  docker not installed/available"
          fi
          echo "Coolify localhost:"
          curl -sS -o /tmp/coolify-ver.txt -w "HTTP %{http_code}\n" --max-time 5 http://localhost:8000 || true
          head -c 200 /tmp/coolify-ver.txt || true
          echo

      - name: Sync voca.kenchange.com on Coolify
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || 'http://localhost:8000' }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          BACKEND_UUID: yydjqewjghoex53en4o0je43
          FRONTEND_UUID: zsq5wwe7xltdrrlp5ldctr3g
        run: |
          chmod +x scripts/coolify-sync-voca-domain.sh
          scripts/coolify-sync-voca-domain.sh

      - name: Smoke /api after sync
        run: |
          set -euo pipefail
          echo "Waiting for Traefik/Coolify to apply domain routes..."
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/voca-api-smoke.txt -w '%{http_code}' --max-time 15 \
              https://voca.kenchange.com/api/profile || true)"
            body="$(head -c 200 /tmp/voca-api-smoke.txt || true)"
            echo "attempt $i: HTTP $code body=${body}"
            # 401 = routing OK (auth required); 200 also OK; 502/503 = still broken
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::https://voca.kenchange.com/api still not healthy after sync"
            exit 1
          fi
          echo "API route smoke passed (HTTP $code)"
