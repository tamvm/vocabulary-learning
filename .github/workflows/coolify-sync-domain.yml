name: Coolify Sync Domain

# Apply production hosts on Coolify (FQDN + CORS/API env).
# UI: https://voca.kenchange.com
# API: https://api.voca.kenchange.com (Host rule, not PathPrefix /api)
# Runs on the self-hosted runner so it can reach Coolify at localhost:8000.

on:
  workflow_dispatch:
  # One-shot: TOM-100 — remove this push trigger after api.voca.kenchange.com works
  push:
    branches:
      - cursor/tom-100-api-subdomain-503a

jobs:
  sync:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose Coolify access on runner
        run: |
          set -euo pipefail
          echo "HOME=$HOME USER=$(whoami)"
          echo "Coolify-related files (names only):"
          ls -la "$HOME/.coolify" 2>/dev/null || echo "  no ~/.coolify"
          ls -la "$HOME/.coolify-tokens-rotated-2026-08-08" 2>/dev/null || echo "  no rotated tokens dir"
          echo "Docker access:"
          if command -v docker >/dev/null 2>&1; then
            docker ps --format 'table {{.Names}}\t{{.Status}}' 2>&1 | head -40 || true
          else
            echo "  docker not installed/available"
          fi

      - name: Sync voca.kenchange.com on Coolify
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || 'http://localhost:8000' }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          BACKEND_UUID: yydjqewjghoex53en4o0je43
          FRONTEND_UUID: zsq5wwe7xltdrrlp5ldctr3g
        run: |
          chmod +x scripts/coolify-sync-voca-domain.sh
          scripts/coolify-sync-voca-domain.sh

      - name: Smoke API host after sync
        run: |
          set -euo pipefail
          origin_ip=178.156.247.159
          echo "Origin Traefik (SNI api.voca.kenchange.com → ${origin_ip})..."
          ok=0
          for i in $(seq 1 18); do
            code="$(curl -skS -o /tmp/voca-api-smoke.txt -w '%{http_code}' --max-time 15 \
              --resolve api.voca.kenchange.com:443:${origin_ip} \
              https://api.voca.kenchange.com/api/words || true)"
            body="$(head -c 200 /tmp/voca-api-smoke.txt || true)"
            echo "attempt $i: origin HTTP $code body=${body}"
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Origin Host api.voca.kenchange.com /api/words is not 401/200"
            exit 1
          fi
          echo "Origin API host smoke passed (HTTP $code)"

          echo "Public DNS:"
          dns="$(dig +short A api.voca.kenchange.com | tr '\n' ' ' || true)"
          echo "  A ${dns:-<empty>}"
          if [ -z "${dns// }" ]; then
            echo "::warning::Add Cloudflare proxied A record api → ${origin_ip} so the SPA can resolve https://api.voca.kenchange.com"
            exit 0
          fi
          pub="$(curl -sS -o /tmp/voca-api-public.txt -w '%{http_code}' --max-time 15 \
            https://api.voca.kenchange.com/api/words || true)"
          echo "Cloudflare https://api.voca.kenchange.com/api/words HTTP $pub $(head -c 120 /tmp/voca-api-public.txt || true)"
          if [ "$pub" != "401" ] && [ "$pub" != "200" ]; then
            echo "::error::Public API host still not healthy after DNS exists"
            exit 1
          fi
